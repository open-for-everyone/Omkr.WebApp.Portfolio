<mat-toolbar color="primary" class="navbar-glass" [@animateMenu]>
  <h1 class="visually-hidden">Keshav Singh Portfolio</h1>
  <a mat-icon-button aria-label="Home" (click)="scrollTop()" href="#top">
    <img src="../../assets/images/k.png" alt="Keshav Singh logo" class="brandImg" loading="lazy" />
  </a>

  <span class="spacer"></span>

  <nav class="nav-links" [class.open]="!isNavbarCollapsed" aria-label="Primary" id="primary-navigation">
    <a mat-button href="#homeHeader" (click)="scrollTop(); toggleNavbar()" [attr.aria-current]="activeSection==='home' ? 'page' : null" [class.active]="activeSection==='home'">Home</a>
    <a mat-button href="#about" (click)="scroll('about'); toggleNavbar()" [attr.aria-current]="activeSection==='about' ? 'location' : null" [class.active]="activeSection==='about'">About me</a>
    <a mat-button href="#skills" (click)="scroll('skills'); toggleNavbar()" [attr.aria-current]="activeSection==='skills' ? 'location' : null" [class.active]="activeSection==='skills'">Skills</a>
    <a mat-button href="#experience" (click)="scroll('experience'); toggleNavbar()" [attr.aria-current]="activeSection==='experience' ? 'location' : null" [class.active]="activeSection==='experience'">Experience</a>
    <a mat-button href="#projects" (click)="scroll('projects'); toggleNavbar()" [attr.aria-current]="activeSection==='projects' ? 'location' : null" [class.active]="activeSection==='projects'">Projects</a>
    <a mat-button href="#contact" (click)="scroll('contact'); toggleNavbar()" [attr.aria-current]="activeSection==='contact' ? 'location' : null" [class.active]="activeSection==='contact'">Contact me</a>
  <a mat-button routerLink="/resume" (click)="toggleNavbar()" routerLinkActive="active" aria-label="Resume page">Resume</a>
    <!-- Blog & Admin moved into profile menu -->
  </nav>

  <span class="spacer"></span>

  <div class="actions">
    <a mat-icon-button href="tel:+919982761929" title="Call us" aria-label="Call">
      <mat-icon>phone</mat-icon>
    </a>
    <a mat-icon-button href="https://wa.me/9982761929" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp">
      <mat-icon>chat</mat-icon>
    </a>
    <!-- Removed duplicate Resume download button; Resume accessible via nav link -->
    <button mat-icon-button (click)="toggleTheme()" [attr.aria-label]="isLight ? 'Switch to dark theme' : 'Switch to light theme'" [attr.aria-pressed]="isLight" title="Toggle theme">
      <mat-icon>{{ isLight ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <!-- Removed high contrast toggle per duplication request -->

    <button mat-icon-button [matMenuTriggerFor]="profileMenu" aria-label="Profile menu" aria-haspopup="true">
      <img src="https://avatars3.githubusercontent.com/keshavsingh4522?size=400" alt="Profile image" class="profileImg" loading="lazy" />
    </button>

    <mat-menu #profileMenu="matMenu" xPosition="before" yPosition="below" class="profile-dropdown">
      <button mat-menu-item (click)="openExternal(blogUrl)" aria-label="Open Blog">
        <mat-icon>article</mat-icon><span>Blog</span>
      </button>
      <button mat-menu-item (click)="openExternal(adminUrl)" aria-label="Open Admin">
        <mat-icon>admin_panel_settings</mat-icon><span>Admin</span>
      </button>
      <button mat-menu-item *ngIf="!loginDisplay" (click)="login('en')" aria-label="Login">
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </button>
      <button mat-menu-item *ngIf="loginDisplay" (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>

  <button mat-icon-button class="menu-toggle" (click)="toggleNavbar()" aria-label="Menu" aria-haspopup="true" [attr.aria-expanded]="!isNavbarCollapsed" aria-controls="primary-navigation">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>
