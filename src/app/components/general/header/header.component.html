<mat-toolbar color="primary" class="navbar-glass" [@animateMenu]>
  <button mat-icon-button aria-label="Home" (click)="scrollTop()">
    <img src="../../assets/images/k.png" alt="brand image" class="brandImg" loading="lazy" />
  </button>

  <span class="spacer"></span>

  <nav class="nav-links" [class.open]="!isNavbarCollapsed">
    <button mat-button [class.active]="activeSection==='home'" (click)="scrollTop(); toggleNavbar()" (keyup.enter)="scrollTop(); toggleNavbar()" (keyup.space)="$event.preventDefault(); scrollTop(); toggleNavbar()">Home</button>
    <button mat-button [class.active]="activeSection==='about'" (click)="scroll('about'); toggleNavbar()" (keyup.enter)="scroll('about'); toggleNavbar()" (keyup.space)="$event.preventDefault(); scroll('about'); toggleNavbar()">About me</button>
    <button mat-button [class.active]="activeSection==='skills'" (click)="scroll('skills'); toggleNavbar()" (keyup.enter)="scroll('skills'); toggleNavbar()" (keyup.space)="$event.preventDefault(); scroll('skills'); toggleNavbar()">Skills</button>
    <button mat-button [class.active]="activeSection==='experience'" (click)="scroll('experience'); toggleNavbar()" (keyup.enter)="scroll('experience'); toggleNavbar()" (keyup.space)="$event.preventDefault(); scroll('experience'); toggleNavbar()">Experience</button>
    <button mat-button [class.active]="activeSection==='projects'" (click)="scroll('projects'); toggleNavbar()" (keyup.enter)="scroll('projects'); toggleNavbar()" (keyup.space)="$event.preventDefault(); scroll('projects'); toggleNavbar()">Projects</button>
    <button mat-button [class.active]="activeSection==='contact'" (click)="scroll('contact'); toggleNavbar()" (keyup.enter)="scroll('contact'); toggleNavbar()" (keyup.space)="$event.preventDefault(); scroll('contact'); toggleNavbar()">Contact me</button>
    <a mat-button [href]="blogUrl" target="_blank" rel="noopener">Blogs</a>
    <a mat-button [href]="adminUrl" target="_blank" rel="noopener">Admin</a>
  </nav>

  <span class="spacer"></span>

  <div class="actions">
    <a mat-icon-button href="tel:+919982761929" title="Call us" aria-label="Call">
      <mat-icon>phone</mat-icon>
    </a>
    <a mat-icon-button href="https://wa.me/9982761929" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp">
      <mat-icon>chat</mat-icon>
    </a>
    <button mat-stroked-button color="accent" (click)="download(slides)" title="Resume">Resume</button>

    <button mat-icon-button (click)="toggleTheme()" [attr.aria-label]="'Toggle theme'" title="Toggle theme">
      <mat-icon>{{ isLight ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button mat-icon-button aria-label="Profile">
      <img src="https://avatars3.githubusercontent.com/keshavsingh4522?size=400" alt="Profile image" class="profileImg" loading="lazy" />
    </button>

    <button mat-icon-button *ngIf="!loginDisplay" (click)="login('en')" title="login" aria-label="Login">
      <mat-icon>login</mat-icon>
    </button>
    <button mat-icon-button *ngIf="loginDisplay" (click)="logout()" title="logout" aria-label="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

  <button mat-icon-button class="menu-toggle" (click)="toggleNavbar()" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>
