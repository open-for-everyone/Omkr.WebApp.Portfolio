<section class="robots">
  <h1>robots.txt (Human Readable)</h1>
  <app-loading-state *ngIf="loading" variant="rows" [count]="4" message="Loading robots.txt…"></app-loading-state>
  <pre *ngIf="!loading">{{ content }}</pre>
  <p class="note">This page shows the same content served to crawlers via the static <code>/robots.txt</code> file.</p>
</section>
