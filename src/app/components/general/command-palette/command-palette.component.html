<!--
  Clicking the backdrop closes the palette; clicking the panel does not. That is decided by
  comparing the event target to the overlay itself, rather than by putting a `stopPropagation` click
  handler on the panel — a handler with no keyboard equivalent, on a non-focusable element, which is
  both an accessibility violation and pointless, since the panel has nothing to activate.

  Escape is handled by a host key listener in the component, so it works wherever focus happens to be.
-->
<div class="overlay" *ngIf="open" role="dialog" aria-modal="true" aria-labelledby="cmd-title" tabindex="-1" (click)="onBackdropClick($event)" (keyup.escape)="close()">
  <div class="panel">
    <h2 id="cmd-title" class="visually-hidden">Command palette</h2>
  <input #commandInput type="text" placeholder="Search commands... (type to filter)" [(ngModel)]="query"
           role="combobox" aria-autocomplete="list" aria-expanded="true"
           aria-controls="cmd-list" [attr.aria-activedescendant]="'cmd-item-' + activeIndex" />
    <ul id="cmd-list" role="listbox">
      <li *ngFor="let i of filtered; let idx = index" [class.active]="idx===activeIndex" role="option" [id]="'cmd-item-' + idx" [attr.aria-selected]="idx===activeIndex" (click)="select(idx)" (keyup.enter)="select(idx)" tabindex="-1">
        <span class="label">{{ i.label }}</span>
        <span class="hint" *ngIf="i.hint">{{ i.hint }}</span>
      </li>
      <li class="empty" *ngIf="filtered.length===0" aria-live="polite">No results</li>
    </ul>
    <div class="help" aria-hidden="true">
      <span>Enter: run</span><span>Esc: close</span><span>↑↓: navigate</span>
    </div>
  </div>
  </div>
