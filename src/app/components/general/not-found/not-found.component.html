<!-- Header and footer come from AppComponent, so this page is reachable in both directions. -->
<section class="notfound" aria-labelledby="notfound-title">
  <div class="scanlines" aria-hidden="true"></div>

  <div class="container notfound-inner">
    <p class="code" aria-hidden="true">404</p>

    <h1 id="notfound-title" class="title">Page not found</h1>

    <p class="lead">
      The page you are looking for might have been removed, renamed, or is temporarily unavailable.
    </p>

    <p class="path" *ngIf="attemptedPath">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <code>{{ attemptedPath }}</code>
    </p>

    <div class="actions">
      <a class="btn-modern" [routerLink]="['/']">
        <mat-icon aria-hidden="true">home</mat-icon> Go home
      </a>
      <button type="button" class="btn-modern ghost" (click)="goBack()">
        <mat-icon aria-hidden="true">arrow_back</mat-icon> Go back
      </button>
    </div>

    <nav class="suggestions" aria-label="Suggested pages">
      <h2 class="suggestions-title">Try one of these</h2>
      <ul>
        <li><a [routerLink]="['/']" fragment="projects">Projects</a></li>
        <li><a [routerLink]="['/']" fragment="experience">Experience</a></li>
        <li><a [routerLink]="['/']" fragment="contact">Contact</a></li>
        <li><a [routerLink]="['/resume']">Resume</a></li>
      </ul>
    </nav>
  </div>
</section>
