<div class="ql-rail" [class.show]="show" role="region" aria-label="Quick links">
  <button mat-icon-button class="ql-nav left" (click)="scrollBy(-240)" [disabled]="!canScrollLeft" aria-label="Scroll left">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <div class="ql-scroller" #scroller (scroll)="onScroll()">
    <button
      *ngFor="let l of links"
      mat-stroked-button
      class="ql-item"
      (click)="navigate(l)"
      [attr.aria-label]="l.label"
    >
      <mat-icon *ngIf="l.icon">{{l.icon}}</mat-icon>
      <span>{{ l.label }}</span>
    </button>
  </div>

  <button mat-icon-button class="ql-nav right" (click)="scrollBy(240)" [disabled]="!canScrollRight" aria-label="Scroll right">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
