<footer [@animateFooter] id="footer">
  <div class="footer-inner container">
    <!-- Top: identity, navigation, elsewhere -->
    <div class="footer-cols">
      <div class="footer-col footer-brand">
        <p class="footer-name">{{ profile.name }}</p>
        <p class="footer-tagline">{{ profile.roles[0] }}</p>

        <ul class="footer-social-links" aria-label="Social profiles">
          <li *ngFor="let social of socials; trackBy: trackSocial">
            <a
              [href]="social.url"
              [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
              [attr.rel]="social.url.startsWith('mailto:') ? null : 'noopener noreferrer'"
              [attr.aria-label]="social.label"
              [title]="social.label"
              (click)="analyticsService.sendAnalyticEvent('click_' + social.id, 'footer', social.id)">
              <fa-icon [icon]="iconFor(social)"></fa-icon>
            </a>
          </li>
        </ul>
      </div>

      <!--
        Section shortcuts. These matter most on the legal pages and the CV, which render no other
        navigation — before the footer was global, those routes were dead ends.
      -->
      <nav class="footer-col" aria-label="Sections">
        <h2 class="footer-col-title">Explore</h2>
        <ul class="footer-list">
          <li *ngFor="let link of navLinks; trackBy: trackNav">
            <a
              *ngIf="link.type === 'external'; else internalFooterLink"
              [href]="link.target"
              target="_blank"
              rel="noopener noreferrer">
              {{ link.label }}
            </a>
            <ng-template #internalFooterLink>
              <a [routerLink]="routerTarget(link)" [fragment]="fragmentFor(link)">{{ link.label }}</a>
            </ng-template>
          </li>
        </ul>
      </nav>

      <nav class="footer-col" aria-label="Elsewhere">
        <h2 class="footer-col-title">Elsewhere</h2>
        <ul class="footer-list">
          <li>
            <a [href]="blogUrl" target="_blank" rel="noopener noreferrer">Blog</a>
          </li>
          <li>
            <a [href]="adminUrl" target="_blank" rel="noopener noreferrer">Admin</a>
          </li>
          <li>
            <a [href]="sourceUrl" target="_blank" rel="nofollow noopener noreferrer">Source code</a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Bottom: credits and legal -->
    <div class="footer-bottom">
      <p class="footer-credits">
        © {{ currentYear }} {{ profile.name }} · Built with Angular
      </p>

      <nav class="footer-legal" aria-label="Legal pages">
        <a routerLink="/privacy-policy">Privacy</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/terms">Terms</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/cookie-policy">Cookies</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/disclaimer">Disclaimer</a>
        <span aria-hidden="true">·</span>
        <!-- The only way back to the consent panel once the banner has been answered. -->
        <button type="button" class="footer-link-btn" (click)="openCookieSettings()">
          Cookie settings
        </button>
      </nav>
    </div>
  </div>
</footer>
