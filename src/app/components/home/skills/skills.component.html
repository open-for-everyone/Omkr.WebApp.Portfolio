<section class="container" aria-label="skills">
  <h2 class="navbar-title" style="font-size:2rem;margin:0 0 1rem;">{{ title }}</h2>
  <div class="skills-grid">
    <div class="skill card" *ngFor="let s of skills" [matTooltip]="s.hint || ''" matTooltipPosition="above">
      <div class="row">
        <span class="name">{{ s.name }}</span>
        <span class="value">{{ s.level }}%</span>
      </div>
      <mat-progress-bar color="primary" [value]="s.level" mode="determinate"></mat-progress-bar>
    </div>
  </div>
</section>
