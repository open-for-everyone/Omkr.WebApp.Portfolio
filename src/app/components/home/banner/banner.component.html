<section class="hero-section" aria-label="Introduction">
  <!-- Animated ambient background -->
  <div class="hero-bg-mesh" aria-hidden="true"></div>

  <div class="container hero-content" [@bannerTrigger]>
    <!-- Left: text content -->
    <div class="hero-text">
      <p class="eyebrow">{{ 'Banner.Pretitle' | translate }}</p>

      <h2 class="hero-name">{{ profile.name }}</h2>

      <!--
        aria-live is deliberately absent: the role cycles every few seconds, and announcing each
        keystroke would make the page unusable with a screen reader. The full list is exposed once,
        statically, to assistive technology instead.
      -->
      <h3 class="hero-role">
        <span class="visually-hidden">{{ profile.roles.join(', ') }}</span>
        <span class="typed-text" aria-hidden="true">{{ currentRole }}</span>
        <span class="cursor" *ngIf="isAnimating" aria-hidden="true">|</span>
      </h3>

      <p class="hero-desc" [innerHTML]="'Banner.Description' | translate"></p>

      <!-- Social links -->
      <div class="hero-socials" role="list" aria-label="Social profiles">
        <a
          *ngFor="let social of socials; trackBy: trackSocial"
          role="listitem"
          class="social-link"
          [href]="social.url"
          [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
          [attr.rel]="social.url.startsWith('mailto:') ? null : 'noopener noreferrer'"
          [attr.aria-label]="social.label"
          [title]="social.label"
          (click)="analyticsService.sendAnalyticEvent('click_' + social.id, 'banner', social.id)">
          <fa-icon [icon]="iconFor(social)"></fa-icon>
        </a>
      </div>

      <!-- Call-to-action buttons -->
      <div class="hero-ctas">
        <a
          [routerLink]="['/']"
          fragment="contact"
          class="cta-primary"
          (click)="analyticsService.sendAnalyticEvent('click_contact', 'banner', 'contact')">
          <mat-icon aria-hidden="true">send</mat-icon>
          {{ 'Banner.ActionBtn' | translate }}
        </a>
        <a
          routerLink="/resume"
          class="cta-secondary"
          (click)="analyticsService.sendAnalyticEvent('click_resume', 'banner', 'resume')">
          <mat-icon aria-hidden="true">description</mat-icon>
          {{ 'Header.cvBtn' | translate }}
        </a>
      </div>
    </div>

    <!-- Right: avatar -->
    <div class="hero-avatar" aria-hidden="true">
      <div class="avatar-ring">
        <img [src]="profile.avatarUrl" [alt]="profile.name" width="320" height="320" loading="eager" />
      </div>
      <div class="deco deco-1"></div>
      <div class="deco deco-2"></div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" aria-hidden="true">
    <div class="arrow"></div>
  </div>
</section>
