<section class="container" aria-label="experience">
  <h2 class="navbar-title" style="font-size:2rem;margin:0 0 1rem;">{{ title }}</h2>
  <div class="experience-list">
    <mat-card *ngFor="let e of items; let i = index" appearance="outlined" class="experience-card">
      <mat-card-header>
        <div mat-card-avatar class="dot">{{ i + 1 }}</div>
        <mat-card-title>{{ e.company }}</mat-card-title>
        <mat-card-subtitle>{{ e.role }} · {{ e.period }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p class="summary">{{ e.summary }}</p>
        <mat-chip-set class="chips">
          <mat-chip *ngFor="let s of e.stack">{{ s }}</mat-chip>
        </mat-chip-set>
      </mat-card-content>
    </mat-card>
  </div>
</section>
