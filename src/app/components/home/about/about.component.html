<section class="about-section section reveal" appReveal aria-labelledby="about-heading">
  <div class="container">
    <h2 id="about-heading" class="section-title">{{ 'AboutMe.Title' | translate }}</h2>

    <div class="about-grid">
      <!-- Text column -->
      <div class="about-text">
        <div class="about-content glass-card">
          <p *ngFor="let text of paragraphs" [innerHTML]="text"></p>

          <!-- Key skills chips -->
          <div class="key-skills" aria-label="Key skills">
            <span class="badge-pill" *ngFor="let chip of keySkills">{{ chip }}</span>
          </div>

          <div class="about-actions">
            <a
              mat-raised-button
              color="primary"
              [href]="mailtoHref"
              (click)="analyticsService.sendAnalyticEvent('click_contact', 'about', 'email')">
              <mat-icon>email</mat-icon> {{ 'Contact.Btn' | translate }}
            </a>
            <a
              *ngIf="linkedInUrl as linkedin"
              mat-stroked-button
              class="btn-outline-accent"
              [href]="linkedin"
              target="_blank"
              rel="noopener noreferrer"
              (click)="analyticsService.sendAnalyticEvent('click_linkedin', 'about', 'linkedin')">
              <mat-icon>open_in_new</mat-icon> LinkedIn
            </a>
          </div>
        </div>
      </div>

      <!-- Avatar column -->
      <div class="about-avatar">
        <div class="avatar-glow-wrap">
          <img
            class="about-profile"
            width="340"
            height="340"
            [src]="profile.avatarUrl"
            [alt]="profile.name"
            loading="lazy" />
          <div class="avatar-glow" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>
</section>
