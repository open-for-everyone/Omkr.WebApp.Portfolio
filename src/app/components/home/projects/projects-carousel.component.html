<section aria-label="projects">
  <div class="container">
  <h2 class="navbar-title" style="font-size:2rem;margin:0 0 1rem;">Highlighted Projects</h2>
  <mat-card appearance="outlined" class="filters">
    <mat-card-content>
      <mat-form-field appearance="outline" style="width:100%;">
        <mat-label>Search projects</mat-label>
        <input matInput [(ngModel)]="query" />
        <button mat-icon-button matSuffix aria-label="Clear" *ngIf="query" (click)="query=''">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
      <div class="tag-row">
        <button mat-stroked-button color="primary" [class.active]="!selectedTag" (click)="selectedTag=null">All</button>
        <button mat-stroked-button color="primary" *ngFor="let t of tags" [class.active]="selectedTag===t" (click)="selectedTag=t">{{ t }}</button>
      </div>
    </mat-card-content>
  </mat-card>
  <ngb-carousel [interval]="6000" [keyboard]="true" [pauseOnHover]="true">
    <ng-template ngbSlide *ngFor="let p of filtered">
      <div class="slide card">
  <img [src]="p.image" alt="Project preview" loading="lazy" width="800" height="450" />
        <div class="content">
          <h3>{{ p.title }}</h3>
          <p class="muted">{{ p.summary }}</p>
          <div class="chips">
            <span class="chip" *ngFor="let t of p.tags">{{ t }}</span>
          </div>
          <div class="actions">
            <button mat-raised-button color="primary" (click)="openDetails(p)">Details</button>
            <a mat-stroked-button color="accent" *ngIf="p.link" [href]="p.link" target="_blank" rel="noopener">Open</a>
          </div>
        </div>
      </div>
    </ng-template>
  </ngb-carousel>
  </div>
</section>
