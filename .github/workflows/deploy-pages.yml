name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Declared for completeness, but it does NOT help here: this repo is owned by `open-for-everyone`
  # and the package by `keshavsingh3197`, and GITHUB_TOKEN is scoped to this repo only. A classic PAT
  # in the PACKAGES_READ_TOKEN secret is the only thing that works cross-owner.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OUTPUT_DIR: dist/omkr.web-app.portfolio/browser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # The private @keshavsingh3197/* packages come from GitHub Packages. The committed .npmrc
      # references ${PACKAGES_READ_TOKEN}; without it npm sends an empty credential and the registry
      # answers 401 for every scoped package.
      #
      # IMPORTANT: unlike the admin and content-blog repos, this one is owned by `open-for-everyone`
      # while the package is owned by `keshavsingh3197`. GITHUB_TOKEN is scoped to THIS repo and
      # cannot read another owner's packages, so a real PAT secret is required here — there is no
      # fallback that works.
      - name: Install dependencies
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Generate sitemap
        run: npm run sitemap

      - name: Build
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Add CNAME for custom domain
        run: echo "keshavsingh.in" > ${{ env.OUTPUT_DIR }}/CNAME

      - name: Copy index.html to 404.html for SPA routing
        run: cp ${{ env.OUTPUT_DIR }}/index.html ${{ env.OUTPUT_DIR }}/404.html

      - name: Add .nojekyll to bypass Jekyll processing
        run: touch ${{ env.OUTPUT_DIR }}/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
